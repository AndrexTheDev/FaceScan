name: Android-Emulatortest

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android-Test-APKs bauen
        working-directory: prototype/android
        run: |
          set -o pipefail
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > local.properties
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build-device.log
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android-Gerätetest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated
          working-directory: prototype/android
          script: ./ci/device-test.sh
      - name: Geräte-Testprotokoll hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-log
          path: ${{ runner.temp }}/facescan-device-tests.log
          if-no-files-found: ignore
      - name: Fehlerinformation melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Emulatorlauf #${{ github.run_number }}"
            echo "Commit \`${{ github.sha }}\`; [Lauf](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo '```'
            tail -c 22000 "$RUNNER_TEMP/facescan-device-tests.log" 2>/dev/null || tail -c 22000 prototype/android/build-device.log 2>/dev/null || echo "Kein Testprotokoll verfügbar."
            echo '```'
          } > /tmp/device-failure.md
          gh issue comment 1 --body-file /tmp/device-failure.md
