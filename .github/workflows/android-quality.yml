name: Android-Qualitätsprüfung ohne APK

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin-Tests ohne APK-Build
        working-directory: prototype/android
        run: |
          set -o pipefail
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > local.properties
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee build-quality.log
      - name: GLB unabhängig validieren
        working-directory: prototype/android
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/facescan-synthetic.glb"
          test -s "$RUNNER_TEMP/facescan-synthetic-textured.glb"
          npm install --prefix "$RUNNER_TEMP/facescan-validator" --no-save --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          node ci/validate-glb.js
      - name: Referenz-Vergleich synthetisch prüfen
        run: |
          python3 -m pip install --user numpy
          python3 -m unittest discover -s prototype/reference/validation -v
      - name: Fehlerprotokoll melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Qualitätsprüfung #${{ github.run_number }}"
            echo "Commit \`${{ github.sha }}\`; [Lauf](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo '```'
            tail -c 30000 prototype/android/build-quality.log 2>/dev/null || echo 'Kein Gradle-Protokoll verfügbar.'
            echo '```'
          } > /tmp/facescan-quality-error.md
          gh issue comment 1 --body-file /tmp/facescan-quality-error.md
