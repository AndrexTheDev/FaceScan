# Baut die Test-APK.
#
# Warum das hier steht und nicht lokal läuft: in der Entwicklungsumgebung
# gibt es kein Java, kein Gradle und kein Android-SDK, und die
# Download-Hosts von Google sind gesperrt. Auf einem GitHub-Runner ist
# alles davon vorhanden. Der CI-Lauf ist damit der Compiler — er sagt,
# was falsch ist, und das ist mehr wert als ein blindes „sollte gehen".
#
# Der zweite Grund: eine APK, die nur auf einem Rechner entsteht, ist
# nichts wert. Hier entsteht sie aus dem Stand, aus dem Repo, für jeden.

name: Test-APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: Zusätzlich ein GitHub-Release mit der APK anlegen
        type: boolean
        default: false
  push:
    branches: ['**']
    paths:
      - 'prototype/android/**'
      - '.github/workflows/apk.yml'
  pull_request:
    paths:
      - 'prototype/android/**'
      - '.github/workflows/apk.yml'

jobs:
  # Erst die Mathematik. Die Kotlin-Tests prüfen denselben Stoff wie die
  # Python-Referenz — wenn die Zahlen hier abweichen, ist die APK zwar
  # gebaut, aber falsch. Ein APK, die rechnet, ist keine Aussage.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Kein setup-android: der ubuntu-Runner bringt das Android-SDK schon
      # mit (ANDROID_HOME ist gesetzt). Eine Abhaengigkeit weniger ist eine
      # Fehlerquelle weniger -- und die hat hier schon einmal gereicht.
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7 verlangt mindestens Gradle 8.9 — darunter bricht der
          # Build mit einer Meldung ab, die nichts über die Ursache sagt.
          gradle-version: '8.9'

      - name: SDK-Plattform 35 installieren
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-leer} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-leer}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Unit-Tests (Kotlin gegen die bekannte Wahrheit)
        working-directory: prototype/android
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee build.log


      - name: Fehlerprotokoll melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Die Entwicklungsumgebung kann Logs und Artefakte nicht abrufen
          # (results-receiver.actions.githubusercontent.com ist gesperrt),
          # kommt aber an Issues. Also steht das Protokoll hier, sonst
          # wuerde ein fehlgeschlagener Build nur "failure" melden und
          # niemand saehe, woran es liegt.
          if [ ! -f prototype/android/build.log ]; then
            echo "(kein build.log -- frueher Schritt gescheitert)" > /tmp/meldung.md
          else
            echo "## Lauf #${{ github.run_number }} — $(basename $GITHUB_JOB)" > /tmp/meldung.md
            echo "Commit \`${{ github.sha }}\`, Job \`$GITHUB_JOB\`." >> /tmp/meldung.md
            echo >> /tmp/meldung.md
            echo '```' >> /tmp/meldung.md
            tail -c 48000 prototype/android/build.log >> /tmp/meldung.md
            echo '```' >> /tmp/meldung.md
          fi
          gh issue comment 1 --body-file /tmp/meldung.md || true

      - name: Testergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: prototype/android/app/build/reports/tests/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: SDK-Plattform 35 installieren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Debug-APK bauen
        working-directory: prototype/android
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Kurzbericht
        run: |
          APK=prototype/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "Groesse: $(du -h "$APK" | cut -f1)"


      - name: Fehlerprotokoll melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Die Entwicklungsumgebung kann Logs und Artefakte nicht abrufen
          # (results-receiver.actions.githubusercontent.com ist gesperrt),
          # kommt aber an Issues. Also steht das Protokoll hier, sonst
          # wuerde ein fehlgeschlagener Build nur "failure" melden und
          # niemand saehe, woran es liegt.
          if [ ! -f prototype/android/build.log ]; then
            echo "(kein build.log -- frueher Schritt gescheitert)" > /tmp/meldung.md
          else
            echo "## Lauf #${{ github.run_number }} — $(basename $GITHUB_JOB)" > /tmp/meldung.md
            echo "Commit \`${{ github.sha }}\`, Job \`$GITHUB_JOB\`." >> /tmp/meldung.md
            echo >> /tmp/meldung.md
            echo '```' >> /tmp/meldung.md
            tail -c 48000 prototype/android/build.log >> /tmp/meldung.md
            echo '```' >> /tmp/meldung.md
          fi
          gh issue comment 1 --body-file /tmp/meldung.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: facescan-test-apk
          path: prototype/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release anlegen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "test-apk-${{ github.run_number }}" \
            --title "Test-APK #${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Debug-Signatur, nur zum Testen." \
            prototype/android/app/build/outputs/apk/debug/app-debug.apk
